# Ovisnosti se provjeravaju tjedno. Grupiranje je namjerno: deset zasebnih
# pull requestova za manje nadogradnje nitko ne pregledava, pa se ne ni otvaraju.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ['org.springframework*']
      ostalo:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router*', '@types/react*']
      alati:
        patterns: ['vite', '@vitejs/*', 'vitest', 'typescript', 'eslint*', 'typescript-eslint']
      ostalo:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
