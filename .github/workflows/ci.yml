name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Novi push na istu granu otkazuje prethodni prolaz — nema smisla trošiti
# minute na rezultat koji više nikoga ne zanima.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build i testovi
    runs-on: ubuntu-latest

    services:
      postgres:
        # Testovi rade protiv stvarnog PostgreSQL-a: ključna jamstva sustava
        # (EXCLUDE constraint nad tstzrange, uvjetni UPDATE-ovi) oslanjaju se na
        # PostgreSQL semantiku, pa bi in-memory baza davala lažno zeleno.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vulkanizer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Postavi JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Testovi
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_TEST_DB: vulkanizer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: mvn -B verify

      - name: Izvještaji o testovima
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend — lint, tipovi, build i testovi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Postavi Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instaliraj ovisnosti
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Provjera tipova
        working-directory: frontend
        run: npm run typecheck

      - name: Jedinični testovi
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Provjera ranjivosti ovisnosti
        working-directory: frontend
        # Upozorava, ali ne ruši build: nova objava ranjivosti ne smije
        # blokirati nepovezani popravak. Nalaze se rješava zasebno.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  e2e:
    name: E2E — ključni poslovni tokovi
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vulkanizer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sagradi backend
        working-directory: backend
        run: mvn -B -q package -DskipTests

      - name: Pokreni backend s demo podacima
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: vulkanizer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: demo
          JWT_SECRET: ci-only-secret-key-with-at-least-32-characters
        run: |
          nohup java -jar backend/target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "Backend se nije podigao:"; tail -50 backend.log; exit 1

      - name: Instaliraj ovisnosti frontenda
        working-directory: frontend
        run: npm ci

      - name: Instaliraj preglednike
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E testovi
        working-directory: frontend
        run: npm run e2e

      - name: Provjera poveznica i SEO podataka
        working-directory: frontend
        run: |
          npm run build
          nohup npx vite preview --port 5173 > preview.log 2>&1 &
          sleep 5
          npm run check:site

      - name: Playwright izvještaj
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
