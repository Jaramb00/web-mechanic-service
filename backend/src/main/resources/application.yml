spring:
  application:
    name: vulkanizer-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vulkanizer}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false          # sprječava lazy-load izvan transakcije i skrivene upite u view sloju
    hibernate:
      ddl-auto: validate         # shemu radi isključivo Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true         # namjerno; demo profil ga otključava

  jackson:
    deserialization:
      fail-on-unknown-properties: true   # tamperirani payload pada glasno, ne tiho
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    # Bez defaulta: aplikacija se NEĆE pokrenuti bez eksplicitno postavljenog ključa.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cookie:
    name: vulkanizer_token
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    slot-minutes: 30
    # Koliko dana unaprijed se može rezervirati termin.
    horizon-days: 60
    # Najkraći rok prije termina u kojem se još smije otkazati.
    cancel-cutoff-hours: 2
    timezone: Europe/Zagreb
  rate-limit:
    login-attempts: 10
    login-window-minutes: 5

logging:
  level:
    root: INFO
    hr.demo.vulkanizer: INFO
