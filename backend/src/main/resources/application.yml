spring:
  application:
    name: vulkanizer-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vulkanizer}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false          # sprječava lazy-load izvan transakcije i skrivene upite u view sloju
    hibernate:
      ddl-auto: validate         # shemu radi isključivo Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true         # namjerno; demo profil ga otključava

  jackson:
    deserialization:
      fail-on-unknown-properties: true   # tamperirani payload pada glasno, ne tiho
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # Bez defaulta: prazno znači da slanje nije konfigurirano.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # Bez timeouta jedan zaglavljeni SMTP poslužitelj drži DB konekciju otvorenom.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # spring-boot-starter-mail sam dodaje provjeru koja na SVAKI /actuator/health
      # otvara SMTP vezu. Posljedica: health je DOWN (503) čim SMTP nije dostupan,
      # iako aplikacija radi — a slanje je po dizajnu best-effort i pad slanja ne
      # smije oboriti rezervaciju, pa ne smije oboriti ni health.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    # Bez defaulta: aplikacija se NEĆE pokrenuti bez eksplicitno postavljenog ključa.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cookie:
    name: vulkanizer_token
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    slot-minutes: 30
    # Koliko dana unaprijed se može rezervirati termin.
    horizon-days: 60
    # Najkraći rok prije termina u kojem se još smije otkazati.
    cancel-cutoff-hours: 2
    timezone: Europe/Zagreb
  rate-limit:
    login-attempts: 10
    login-window-minutes: 5
  mail:
    # Ugašeno po defaultu: nitko tko klonira repozitorij ne počne slučajno slati
    # e-mailove, a demo radi bez ijedne vanjske ovisnosti.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    # TODO(klijent): u produkciji ide adresa servisa, ne osobna.
    shop-recipient: ${MAIL_SHOP_RECIPIENT:}
    portal-url: ${MAIL_PORTAL_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    hr.demo.vulkanizer: INFO
