# Demo okruženje: baza, backend i frontend.
#
# Pokretanje:
#   cp .env.example .env    # pa popuniti vrijednosti
#   docker compose up --build
#
# Aplikacija: http://localhost:8080  (nginx poslužuje frontend i posreduje /api)
# Swagger:    http://localhost:8080/swagger-ui.html

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulkanizer}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER mora biti postavljen u .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mora biti postavljen u .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Baza namjerno NIJE izložena na host: pristupa joj se samo iz mreže
    # compose-a. Za lokalni pristup alatom odkomentirati:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vulkanizer}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET mora biti postavljen u .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      # Frontend i backend dijele origin iza nginxa, pa cookie ne mora biti
      # cross-site. U produkciji iza HTTPS-a postaviti COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Slanje je ugašeno dok se MAIL_ENABLED ne postavi na true; tada su sve
      # ostale MAIL_* obavezne i aplikacija se bez njih ne diže.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SHOP_RECIPIENT: ${MAIL_SHOP_RECIPIENT:-}
      MAIL_PORTAL_URL: ${MAIL_PORTAL_URL:-http://localhost:8080}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Prazno znači „isti origin": nginx posreduje /api na backend.
        VITE_API_BASE_URL: ""
        VITE_ANALYTICS_ID: ${VITE_ANALYTICS_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
