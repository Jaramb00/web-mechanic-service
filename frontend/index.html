<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1424" />

    <!-- Naslov i opis postavlja svaka ruta kroz src/lib/seo.ts.
         Ove vrijednosti su zadane i vide se prije hidracije. -->
    <title>Vulkanizer Željko — rezervacija termina online</title>
    <meta
      name="description"
      content="Zamjena sezonskih guma, balansiranje, popravak gume i hotel za gume. Rezervirajte termin online i vidite točno kad ima mjesta."
    />
    <link rel="canonical" href="https://www.primjer-vulkanizer.hr/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:site_name" content="Vulkanizer Željko (demo)" />
    <meta property="og:title" content="Vulkanizer Željko — rezervacija termina online" />

      property="og:description"

    />
    <meta property="og:image" content="https://www.primjer-vulkanizer.hr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vulkanizer Željko — rezervacija termina online" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Font se poslužuje s vlastite domene; preload skraćuje prvi ispis. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Za rezervaciju termina potreban je JavaScript. Nazovite nas na broj naveden na stranici
      i rado ćemo vas naručiti telefonom.

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
