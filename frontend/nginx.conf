server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Sigurnosna zaglavlja ------------------------------------------------
    # Backend postavlja svoja zaglavlja za API; ova vrijede za HTML stranicu.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS ima smisla tek kad je TLS na mjestu. Uključiti kad domena radi na HTTPS-u:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ------------------------------------------------------------------
    # Frontend i API dijele origin, pa cookie s tokenom radi bez CORS-a i bez
    # SameSite iznimki. Isto vrijedi u razvoju kroz Vite proxy.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Statika --------------------------------------------------------------
    # Datoteke s otiskom u imenu mijenjaju ime pri svakoj izmjeni, pa se smiju
    # predmemorirati zauvijek.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html se NE predmemorira: inače korisnik nakon deploya dobije staru
    # stranicu koja traži datoteke kojih više nema.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: sve nepoznate putanje obrađuje React Router, koji prikazuje 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
